[mcp_servers.fusion]
url = "http://127.0.0.1:27182/mcp"
enabled = true
required = false
default_tools_approval_mode = "prompt"
startup_timeout_sec = 15
tool_timeout_sec = 60

[mcp_servers.cadquery]
command = "powershell"
args = ["-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/cadquery_mcp.ps1"]
cwd = "."
enabled = true
required = false
default_tools_approval_mode = "prompt"
startup_timeout_sec = 30
tool_timeout_sec = 120
