name: xplat-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install project
        run: python -m pip install -e .
      - name: Load solve trace
        run: python tools/xplat_load_solve_trace.py
