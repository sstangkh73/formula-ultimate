name: xplat-probe

# Temporary diagnostic: runs tools/xplat_digest_probe.py on Linux so its output
# can be diffed against the same probe run on the Windows development machine.
# Delete this workflow once the cross-platform digest difference is resolved.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Run probe
        run: python tools/xplat_digest_probe.py
