name: xplat-probe

# Temporary diagnostic for the cross-platform digest difference.
# Delete once the difference is resolved.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install project
        run: python -m pip install -e .
      - name: Call trace
        run: python tools/xplat_call_trace.py
